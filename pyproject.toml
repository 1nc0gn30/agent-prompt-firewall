[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-prompt-firewall"
version = "0.1.0"
description = "Autonomous zero-dependency inline security proxy and threat radar for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Neal Frazier Tech", email = "1nc0gn30@users.noreply.github.com"}
]
dependencies = []

[project.scripts]
agent-firewall = "agent_prompt_firewall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

